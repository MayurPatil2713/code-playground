<!DOCTYPE html>
<html>
    <head>
        <title>Student Form</title>
    </head>
    <body>
        {% if messages %}
            {% for message in messages %}
                <p> {{ message }} </p>
            {% endfor %}
        {% endif %}
        
        <form method="post">
            {% csrf_token %}

            {{ form }}
            
            <button type="submit">Submit</button>
        </form>
    </body>
</html>
