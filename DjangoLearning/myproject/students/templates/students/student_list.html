<!DOCTYPE html>
<html>
    <head>
        <title>Student List</title>
    </head>
    <body>
        {% if messages %}
            {% for message in messages %}
                <p>{{ message }}</p>
            {% endfor %}
        {% endif %}
        
        <h1>Student List</h1>
        <table border="1">
            <tr>
                <th>Name</th>
                <th>Age</th>
                <th>Email</th>
                <th>Course</th>
            </tr>
            
            {% for student in students %}
            <tr>
                <td>{{ student.name }}</td>
                <td>{{ student.age }}</td>
                <td>{{ student.email }}</td>
                <td>{{ student.course }}</td>
                <td>
                    <a href="{% url 'student_edit' student.id %}">Edit</a>
                </td>
                <td>
                    <a href="{% url 'student_delete' student.id %}">Delete</a>
                </td>
            </tr>
            {% endfor %}

        </table>
    </body>
</html>
